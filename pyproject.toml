[project]
name = "nkr-segmentation"
version = "0.1.0"
description = "Segmentation preprocessing and eCognition ruleset workflow for Naturkart ground-truth collection."
readme = "README.md"
authors = [
  {name = "Syver Jahren Petersen", email = "syver.jahren.petersen@miljodir.no"},
  {name = "Willeke A'Campo", email = "willeke.acampo@miljodir.no"}
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3",
  "scipy>=1.11",
  "tqdm>=4.66",
  # Cross-platform GDAL pinning: Linux commonly relies on 3.6.x,
  # while Windows uses newer wheel builds.
  "gdal==3.6.2; sys_platform != 'win32'",
  "gdal>=3.10.3,<4; sys_platform == 'win32'",
]

[dependency-groups]
gpu = [
  "cupy-cuda13x>=14.1.1,<15; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
dev = [
  "mypy>=1.19",
  "pre-commit>=3.8",
  "pytest>=8.2",
  "ruff>=0.15",
]

[tool.uv]
package = false

[tool.uv.sources]
gdal = { index = "geospatial_wheels", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "geospatial_wheels"
url = "https://nathanjmcdougall.github.io/geospatial-wheels-index/"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# RUFF rules
[tool.ruff]
exclude = [
  "tmp",
]

line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E4",    # pycodestyle: indentation errors
  "E7",    # pycodestyle: statements and control flow
  "E9",    # pycodestyle: runtime errors
  "F",     # pyflakes: code correctness
  "B",     # flake8-bugbear: likely bugs and design problems
  "ERA",   # eradicate: commented-out code
  "D",     # pydocstyle: docstring conventions
  "N"      # pep8-naming: naming conventions
]

ignore = [
  "D107",   # pydocstyle: Missing docstring in __init__
  "D213",   # pydocstyle: Multi-line summary should start at the second line
  "E501",   # pycodestyle: Line too long
  "F401",   # pyflakes: Module imported but unused
  "D417",   # pydocstyle: Missing argument descriptions in docstrings
  "ERA001"  # eradicate: Commented out code
]

unfixable = [
  "B"   # flake8-bugbear
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E", "D"]
"tests/*.py" = ["D"]
"**/*.ipynb" = ["D"]
"scripts/*.py" = ["D"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

## MYPY rules
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
